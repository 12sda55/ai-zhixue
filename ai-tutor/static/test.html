<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tutor - 小智</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#0d1117;--sd:#161b22;--card:#1c2128;--bd:#30363d;--ac:#7c5cfc;--a2:#58a6ff;--g:#3fb950;--r:#f85149;--y:#d29922;--t:#e6edf3;--t2:#8b949e;--rd:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
/* sidebar */
.sb{width:300px;background:var(--sd);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sbh{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.sbh h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sbh .dot{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sbb{flex:1;overflow-y:auto;padding:14px}
.sbs h3{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.sbs h3:first-child{margin-top:0}
.sr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
.sr .l{color:var(--t2)}.sr .v{font-weight:600}
.kt{font-size:11px;margin:4px 0}
.kt .ktn{color:var(--t2)}
.bar-wrap{height:6px;background:var(--bd);border-radius:3px;margin:3px 0}
.bar-f{height:100%;border-radius:3px;transition:width .5s}
.bar-h{background:var(--g)}.bar-m{background:var(--y)}.bar-l{background:var(--r)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;margin:1px}
.tag-weak{background:rgba(248,81,73,.2);color:var(--r)}
.tag-solid{background:rgba(63,185,80,.2);color:var(--g)}
.tag-new{background:rgba(124,92,252,.2);color:var(--ac)}
/* main */
.mn{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{display:flex;border-bottom:1px solid var(--bd);background:var(--sd);padding:0 16px;flex-wrap:wrap}
.tb-btn{padding:10px 14px;font-size:13px;background:none;border:none;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.tb-btn:hover{color:var(--t)}
.tb-btn.active{color:var(--a2);border-bottom-color:var(--a2)}
.tc{flex:1;overflow:hidden;position:relative}
.tc>div{display:none;height:100%;overflow-y:auto;padding:16px}
.tc>div.active{display:flex;flex-direction:column}
/* chat */
.chat-msgs{flex:1;overflow-y:auto;padding-bottom:8px}
.msg{padding:10px 14px;margin-bottom:8px;border-radius:var(--rd);max-width:85%;font-size:13px;line-height:1.6;word-break:break-word}
.msg.user{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--card);border:1px solid var(--bd);margin-right:auto;border-bottom-left-radius:4px}
.msg .ts{font-size:10px;color:var(--t2);margin-top:4px}
.chat-inp{display:flex;gap:8px;padding:12px 0;border-top:1px solid var(--bd)}
.chat-inp input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:13px;outline:none}
.chat-inp input:focus{border-color:var(--ac)}
.chat-inp button{padding:10px 18px;background:var(--ac);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.chat-inp button:hover{opacity:.9}
.chat-inp button:disabled{opacity:.5;cursor:not-allowed}
.qb{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.qb button{padding:5px 12px;font-size:11px;background:var(--card);border:1px solid var(--bd);border-radius:6px;color:var(--t2);cursor:pointer}
.qb button:hover{border-color:var(--ac);color:var(--t)}
/* practice */
.kpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.kpi{padding:12px 8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;text-align:center;cursor:pointer;font-size:12px;transition:.2s}
.kpi:hover{border-color:var(--ac);background:rgba(124,92,252,.1)}
.kpi.active{border-color:var(--ac);background:rgba(124,92,252,.15)}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:16px;margin-bottom:12px}
.qcard .qinfo{font-size:11px;color:var(--t2);margin-bottom:8px}
.qcard .qdesc{font-size:14px;line-height:1.6;margin-bottom:12px}
.qcard .qcode{background:#0d1117;padding:10px 14px;border-radius:8px;font-family:'Fira Code',monospace;font-size:12px;white-space:pre-wrap;margin:8px 0}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;margin:4px 0;background:var(--sd);border:1px solid var(--bd);border-radius:8px;color:var(--t);cursor:pointer;font-size:13px;transition:.2s}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:rgba(124,92,252,.15)}
.opt.correct{border-color:var(--g);background:rgba(63,185,80,.15)}
.opt.wrong{border-color:var(--r);background:rgba(248,81,73,.15)}
.inp{width:100%;padding:10px 14px;background:var(--sd);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:13px;outline:none;margin:6px 0}
.inp:focus{border-color:var(--ac)}
textarea.inp{min-height:80px;resize:vertical;font-family:'Fira Code',monospace}
.fb{padding:12px;border-radius:8px;margin:8px 0;font-size:13px}
.fb-ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3)}
.fb-err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3)}
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pbar .pb-t{font-size:12px;color:var(--t2)}
.pbar .pb-r{height:6px;flex:1;background:var(--bd);border-radius:3px}
.pbar .pb-f{height:100%;background:var(--a2);border-radius:3px;transition:width .3s}
.act-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600;transition:.2s}
.btn-ac{background:var(--ac);color:#fff}
.btn-ac:hover{opacity:.9}
.btn-bd{background:var(--card);color:var(--t);border:1px solid var(--bd)}
.btn-bd:hover{border-color:var(--ac)}
.btn-g{background:rgba(63,185,80,.2);color:var(--g);border:1px solid rgba(63,185,80,.3)}
.btn-r{background:rgba(248,81,73,.2);color:var(--r);border:1px solid rgba(248,81,73,.3)}
.btn-y{background:rgba(210,153,34,.2);color:var(--y);border:1px solid rgba(210,153,34,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.summary{text-align:center;padding:30px}
.summary .big{font-size:48px;font-weight:700;margin-bottom:8px}
.summary .sub{font-size:14px;color:var(--t2)}
.summary .stats{display:flex;justify-content:center;gap:20px;margin:16px 0}
.summary .stat{text-align:center}
.summary .stat .n{font-size:24px;font-weight:700}
.summary .stat .lb{font-size:11px;color:var(--t2)}
/* code tab */
.ce{display:flex;flex:1;gap:12px}
.ce-left{flex:1;display:flex;flex-direction:column}
.ce-right{width:340px;overflow-y:auto;flex-shrink:0}
.cs{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.cs select{padding:6px 10px;background:var(--sd);border:1px solid var(--bd);border-radius:6px;color:var(--t);font-size:12px}
.cm{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cm textarea{width:100%;min-height:180px;padding:12px;background:#0d1117;color:var(--t);border:none;font-family:'Fira Code',monospace;font-size:13px;resize:vertical;outline:none;tab-size:4}
.co{padding:10px 14px;background:var(--sd);border-radius:8px;font-size:12px;font-family:'Fira Code',monospace;white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-top:8px}
.an{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:12px;line-height:1.6}
.an h4{font-size:13px;margin-bottom:6px;color:var(--a2)}
/* path tab */
.path-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:14px;margin-bottom:10px}
.path-card h4{font-size:14px;margin-bottom:8px;color:var(--a2)}
.path-node{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--bd)}
.path-node:last-child{border-bottom:none}
.path-node .pn-ord{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.pn-mastered{background:rgba(63,185,80,.2);color:var(--g)}
.pn-learning{background:rgba(210,153,34,.2);color:var(--y)}
.pn-todo{background:rgba(139,148,158,.2);color:var(--t2)}
.pn-weak{background:rgba(248,81,73,.2);color:var(--r)}
.pn-review{background:rgba(88,166,255,.2);color:var(--a2)}
.path-node .pn-name{flex:1}
.path-node .pn-hours{color:var(--t2);font-size:11px}
.path-sim{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sim-card{background:var(--sd);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center}
.sim-card .sim-period{font-size:13px;font-weight:600;margin-bottom:6px}
.sim-card .sim-val{font-size:20px;font-weight:700;color:var(--a2)}
.sim-card .sim-label{font-size:10px;color:var(--t2)}
/* dashboard tab */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.dash-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:16px;text-align:center}
.dash-card .dc-val{font-size:28px;font-weight:700;margin-bottom:4px}
.dash-card .dc-label{font-size:12px;color:var(--t2)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.ach-item{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;font-size:12px}
.ach-item.unlocked{border-color:var(--y);background:rgba(210,153,34,.08)}
.ach-item .ach-icon{font-size:24px;margin-bottom:4px}
.ach-item .ach-name{font-weight:600;margin-bottom:2px}
.ach-item .ach-desc{color:var(--t2);font-size:10px}
.ach-item .ach-bar{height:4px;background:var(--bd);border-radius:2px;margin-top:4px}
.ach-item .ach-bar-f{height:100%;border-radius:2px;background:var(--y)}
.radar-wrap{display:flex;justify-content:center;margin:16px 0}
/* review schedule */
.review-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;font-size:12px}
.review-item.urgent{border-left:3px solid var(--r)}
.review-item.soon{border-left:3px solid var(--y)}
.review-item.normal{border-left:3px solid var(--g)}
.review-item .ri-name{flex:1;font-weight:600}
.review-item .ri-urgency{font-size:10px;padding:2px 6px;border-radius:4px}
.ri-urgent{background:rgba(248,81,73,.2);color:var(--r)}
.ri-soon{background:rgba(210,153,34,.2);color:var(--y)}
.ri-normal{background:rgba(63,185,80,.2);color:var(--g)}
/* modal */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:999;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal .mc{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}
.modal select,.modal input{width:100%;padding:8px 12px;background:var(--sd);border:1px solid var(--bd);border-radius:6px;color:var(--t);font-size:13px}
.modal .radios{display:flex;gap:8px;flex-wrap:wrap}
.modal .radios label{padding:6px 12px;background:var(--sd);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:12px}
.modal .radios input:checked+span{color:var(--a2)}
.tip{padding:8px 14px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);border-radius:8px;font-size:12px;color:var(--y);margin-bottom:12px}
.stbar{padding:6px 16px;background:var(--sd);border-top:1px solid var(--bd);font-size:11px;color:var(--t2);display:flex;gap:12px;min-height:30px;align-items:center}
.stbar .ag{display:flex;align-items:center;gap:4px}
.stbar .ag .sp{width:10px;height:10px;border-radius:50%;border:2px solid var(--ac);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stbar .ag.done{color:var(--g)}
.loading{text-align:center;padding:20px;color:var(--t2)}
.empty{text-align:center;padding:40px;color:var(--t2)}
.empty .icon{font-size:48px;margin-bottom:12px}
.section-title{font-size:15px;font-weight:700;margin:16px 0 10px;color:var(--a2)}
</style>
</head>
<body>
<div class="app">
<!-- Sidebar -->
<div class="sb" id="sidebar">
<div class="sbh">
  <div class="dot"></div>
  <h1>小智 AI Tutor</h1>
</div>
<div class="sbb" id="sidebarBody">
  <div class="empty" id="sbEmpty">
    <div class="icon">👋</div>
    <p>点击下方按钮建立学习画像</p>
  </div>
  <div id="sbContent" style="display:none">
    <div class="sbs">
      <h3>基本信息</h3>
      <div id="sbProfile"></div>
    </div>
    <div class="sbs">
      <h3>知识掌握</h3>
      <div id="sbTree"></div>
    </div>
    <div class="sbs">
      <h3>薄弱环节</h3>
      <div id="sbWeak"></div>
    </div>
    <div class="sbs">
      <h3>学习统计</h3>
      <div id="sbStats"></div>
    </div>
  </div>
</div>
</div>
<!-- Main -->
<div class="mn">
<div class="tb" id="tabBar">
  <button class="tb-btn active" onclick="switchTab('chat')">对话</button>
  <button class="tb-btn" onclick="switchTab('practice')">练习</button>
  <button class="tb-btn" onclick="switchTab('code')">代码</button>
  <button class="tb-btn" onclick="switchTab('path')">路径</button>
  <button class="tb-btn" onclick="switchTab('dashboard')">仪表盘</button>
</div>
<div class="tc">
  <!-- Chat Tab -->
  <div class="active" id="tabChat">
    <div class="chat-msgs" id="chatMsgs">
      <div class="msg ai">你好！我是小智，你的AI数据结构辅导老师。<br>请先点击下方 <b>"建立画像"</b> 按钮，让我了解你的学习情况。<br><br>或者直接问我任何数据结构问题！</div>
    </div>
    <div class="qb" id="quickBtns">
      <button onclick="openColdStart()">建立画像</button>
      <button onclick="sendQuick('什么是数组？')">什么是数组？</button>
      <button onclick="sendQuick('链表和数组有什么区别？')">链表vs数组</button>
      <button onclick="sendQuick('二叉树的遍历方式有哪些？')">二叉树遍历</button>
      <button onclick="sendQuick('给我讲讲快速排序')">快速排序</button>
    </div>
    <div class="chat-inp">
      <input id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button id="chatSend" onclick="sendMsg()">发送</button>
    </div>
  </div>
  <!-- Practice Tab -->
  <div id="tabPractice">
    <div id="practiceKpg">
      <div class="tip" id="practiceTip" style="display:none"></div>
      <div class="kpg" id="kpGrid"></div>
    </div>
    <div id="practiceQ" style="display:none"></div>
    <div id="practiceSummary" style="display:none"></div>
  </div>
  <!-- Code Tab -->
  <div id="tabCode">
    <div class="ce">
      <div class="ce-left">
        <div class="cs">
          <select id="codeKp" onchange="onCodeKpChange()"><option value="">选择知识点</option></select>
          <select id="codeTpl" onchange="onCodeTplChange()"><option value="">选择模板</option></select>
          <button class="btn btn-ac" onclick="runCode()" id="btnRun">▶ 运行</button>
          <button class="btn btn-bd" onclick="analyzeCode()">AI解析</button>
        </div>
        <div class="cm"><textarea id="codeEditor" placeholder="选择知识点和模板，或在此输入代码..."></textarea></div>
        <div id="codeOutput" class="co" style="display:none"></div>
      </div>
      <div class="ce-right">
        <div id="codeAnalysis" class="an" style="display:none">
          <h4>AI 代码解析</h4>
          <div id="codeAnalysisBody"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Path Tab -->
  <div id="tabPath">
    <div id="pathContent">
      <div class="loading">加载学习路径中...</div>
    </div>
  </div>
  <!-- Dashboard Tab -->
  <div id="tabDashboard">
    <div id="dashContent">
      <div class="loading">加载仪表盘中...</div>
    </div>
  </div>
</div>
<div class="stbar" id="statusBar">就绪</div>
</div>
</div>
<!-- Cold Start Modal -->
<div class="modal" id="coldModal">
<div class="mc">
  <h3>快速建立学习画像</h3>
  <label>1. 你的专业背景？</label>
  <select id="csMajor">
    <option value="计算机相关专业">计算机相关专业</option>
    <option value="理工科（非计算机）">理工科（非计算机）</option>
    <option value="文科/跨考">文科/跨考</option>
  </select>
  <label>2. 当前学习阶段？</label>
  <select id="csStage">
    <option value="预习/入门">预习/入门</option>
    <option value="同步课堂学习">同步课堂学习</option>
    <option value="备考/复习">备考/复习</option>
    <option value="查漏补缺">查漏补缺</option>
  </select>
  <label>3. 你的学习目标？</label>
  <input id="csGoal" placeholder="如：通过期末考试、考研408、提升编程能力...">
  <label>4. 你偏好什么样的学习方式？</label>
  <div class="radios">
    <label><input type="radio" name="csStyle" value="visual" checked> <span>视觉型（看图/动画）</span></label>
    <label><input type="radio" name="csStyle" value="verbal"> <span>文字型（读文档）</span></label>
    <label><input type="radio" name="csStyle" value="practical"> <span>实践型（写代码）</span></label>
  </div>
  <div style="margin-top:16px;display:flex;gap:8px">
    <button class="btn btn-ac" onclick="doColdStart()" style="flex:1">确认并开始学习</button>
    <button class="btn btn-bd" onclick="closeCold()">跳过</button>
  </div>
</div>
</div>

<script>
// ===== GLOBAL STATE =====
const API = '';
let userId = localStorage.getItem('ai_tutor_uid') || ('u' + Date.now().toString(36));
localStorage.setItem('ai_tutor_uid', userId);
let profile = null;
let activeTab = 'chat';

// ===== UTILS =====
function setStatus(txt) { document.getElementById('statusBar').textContent = txt; }
async function api(url, opts = {}) {
  const r = await fetch(API + url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(`${r.status}: ${t.substring(0,200)}`); }
  return r.json();
}
function $(id) { return document.getElementById(id); }

// ===== TAB SWITCHING =====
function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tb-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tc>div').forEach(d => d.classList.remove('active'));
  const tabMap = { chat: 0, practice: 1, code: 2, path: 3, dashboard: 4 };
  const idx = tabMap[t] ?? 0;
  document.querySelectorAll('.tb-btn')[idx]?.classList.add('active');
  $('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
  if (t === 'practice') loadPractice();
  else if (t === 'code') loadCodeTab();
  else if (t === 'path') loadPathTab();
  else if (t === 'dashboard') loadDashboard();
}

// ===== COLD START =====
function openColdStart() { $('coldModal').classList.add('show'); }
function closeCold() { $('coldModal').classList.remove('show'); }

const MAJOR_MAP = { '计算机相关专业': 'computer_science', '理工科（非计算机）': 'related_major', '文科/跨考': 'cross_exam' };
const STAGE_MAP = { '预习/入门': 'preview', '同步课堂学习': 'synchronous', '备考/复习': 'exam_prep', '查漏补缺': 'review' };

async function doColdStart() {
  const major = MAJOR_MAP[$('csMajor').value] || 'non_cs';
  const stage = STAGE_MAP[$('csStage').value] || 'preview';
  const goalText = $('csGoal').value || '数据结构学习';
  const style = document.querySelector('input[name="csStyle"]:checked')?.value || 'visual';
  setStatus('正在建立画像...');
  try {
    const r = await api(`/api/profile/${userId}/init`, {
      method: 'POST',
      body: JSON.stringify({ major, stage, learning_goals: [goalText], cognitive_style: style })
    });
    profile = r;
    closeCold();
    renderSidebar();
    const styleLabel = style === 'visual' ? '视觉型' : style === 'verbal' ? '文字型' : '实践型';
    addChatMsg('ai', `你好！我已经根据你的信息建立了学习画像。\n\n**专业背景**：${$('csMajor').value}\n**学习阶段**：${$('csStage').value}\n**学习目标**：${goalText}\n**认知风格**：${styleLabel}\n\n你可以开始问我任何数据结构问题了！`);
    await api(`/api/events/`, { method: 'POST', body: JSON.stringify({ user_id: userId, event_type: 'cold_start_complete' }) }).catch(() => {});
  } catch (e) {
    setStatus('画像建立失败: ' + e.message);
    alert('建立失败: ' + e.message);
  }
}

// ===== SIDEBAR =====
async function refreshProfile() {
  try { profile = await api(`/api/profile/${userId}`); renderSidebar(); } catch (e) { /* ignore */ }
}

function renderSidebar() {
  if (!profile || !profile.major) { $('sbEmpty').style.display = 'block'; $('sbContent').style.display = 'none'; return; }
  $('sbEmpty').style.display = 'none';
  $('sbContent').style.display = 'block';

  const mMap = { computer_science: '计算机', related_major: '理工科', non_cs: '非计算机', cross_exam: '跨考' };
  const sMap = { preview: '预习', synchronous: '同步学习', review: '复习', exam_prep: '备考' };
  const styleMap = { visual: '视觉型', verbal: '文字型', practical: '实践型' };
  $('sbProfile').innerHTML = `
    <div class="sr"><span class="l">专业</span><span class="v">${mMap[profile.major] || profile.major}</span></div>
    <div class="sr"><span class="l">阶段</span><span class="v">${sMap[profile.stage] || profile.stage}</span></div>
    <div class="sr"><span class="l">目标</span><span class="v">${(profile.learning_goals||[])[0] || '-'}</span></div>
    <div class="sr"><span class="l">风格</span><span class="v">${styleMap[profile.cognitive_style] || '-'}</span></div>
    <div class="sr"><span class="l">难度偏好</span><span class="v">${profile.difficulty_level || '中等'}</span></div>
  `;

  const kt = profile.knowledge_tree || {};
  if (Object.keys(kt).length > 0) {
    let h = '';
    for (const [k, v] of Object.entries(kt).slice(0, 12)) {
      const mastery = typeof v === 'object' ? (v.mastery || 0) : (typeof v === 'number' ? v : 0);
      const cls = mastery >= 0.7 ? 'bar-h' : mastery >= 0.3 ? 'bar-m' : 'bar-l';
      h += `<div class="kt"><span class="ktn">${k}</span><div class="bar-wrap"><div class="bar-f ${cls}" style="width:${Math.round(mastery*100)}%"></div></div></div>`;
    }
    $('sbTree').innerHTML = h || '<div class="sr"><span class="l">暂无数据</span></div>';
  } else {
    $('sbTree').innerHTML = '<div class="sr"><span class="l">开始答题后显示</span></div>';
  }

  const weak = (profile.weak_points || []).map(w => typeof w === 'string' ? w : (w.knowledge_point || w.id || ''));
  $('sbWeak').innerHTML = weak.length > 0
    ? weak.map(w => `<span class="tag tag-weak">${w}</span>`).join('')
    : '<span class="tag tag-new">暂无薄弱点</span>';

  $('sbStats').innerHTML = `
    <div class="sr"><span class="l">对话轮次</span><span class="v">${profile.conversation_count || 0}</span></div>
    <div class="sr"><span class="l">最后更新</span><span class="v">${(profile.updated_at || '').substring(0,10)}</span></div>
  `;
}

// ===== CHAT =====
function addChatMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = marked.parse ? marked.parse(text) : text.replace(/\n/g, '<br>');
  $('chatMsgs').appendChild(d);
  $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
}

async function sendMsg() {
  const inp = $('chatInput');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  addChatMsg('user', msg);
  inp.disabled = true; $('chatSend').disabled = true;
  setStatus('思考中...');

  try {
    const r = await fetch(API + '/api/chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, message: msg })
    });
    if (!r.ok) throw new Error('Chat failed');
    const data = await r.json();
    addChatMsg('ai', data.reply || data.message || '（未获取到回复）');
    setStatus('就绪');
    refreshProfile();
  } catch (e) {
    addChatMsg('ai', '抱歉，回复出错了：' + e.message);
    setStatus('错误');
  }
  inp.disabled = false; $('chatSend').disabled = false;
}

function sendQuick(msg) {
  $('chatInput').value = msg;
  sendMsg();
}

// ===== PRACTICE =====
const KP_LIST = [
  { id: 'array', name: '数组' }, { id: 'linked_list', name: '链表' }, { id: 'stack', name: '栈' },
  { id: 'queue', name: '队列' }, { id: 'hash_table', name: '哈希表' }, { id: 'binary_tree', name: '二叉树' },
  { id: 'bst', name: 'BST' }, { id: 'avl', name: 'AVL树' }, { id: 'heap', name: '堆' },
  { id: 'graph_basics', name: '图基础' }, { id: 'bubble_sort', name: '冒泡排序' }, { id: 'quick_sort', name: '快速排序' },
  { id: 'merge_sort', name: '归并排序' }, { id: 'binary_search', name: '二分查找' }, { id: 'recursion', name: '递归' }
];
let pracKp = null, pracQuestions = [], pracIdx = 0, pracResults = [];

function loadPractice() {
  if ($('kpGrid').children.length === 0) initKpGrid();
}

function initKpGrid() {
  $('kpGrid').innerHTML = KP_LIST.map(k =>
    `<div class="kpi" onclick="startPractice('${k.id}')">${k.name}</div>`
  ).join('');
  if (!profile || !profile.major) {
    $('practiceTip').style.display = 'block';
    $('practiceTip').textContent = '提示：建议先点击对话Tab中的"建立画像"按钮，出题会更精准';
  }
}

async function startPractice(kp) {
  pracKp = kp; pracIdx = 0; pracResults = [];
  $('practiceKpg').style.display = 'none';
  $('practiceQ').style.display = 'block';
  $('practiceSummary').style.display = 'none';
  setStatus(`加载 ${kp} 题目中...`);
  try {
    const data = await api(`/api/questions/${userId}/batch?knowledge_point=${kp}&batch_size=5`);
    pracQuestions = Array.isArray(data.questions) ? data.questions : (Array.isArray(data) ? data : []);
    if (pracQuestions.length === 0) { showPracticeError('暂无题目'); return; }
    showQuestion();
  } catch (e) {
    showPracticeError('加载失败: ' + e.message);
  }
}

function showPracticeError(msg) {
  $('practiceQ').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${msg}</p><button class="btn btn-ac" onclick="backToKpGrid()">返回</button></div>`;
  setStatus('就绪');
}

function backToKpGrid() {
  $('practiceKpg').style.display = 'block';
  $('practiceQ').style.display = 'none';
  $('practiceSummary').style.display = 'none';
  setStatus('就绪');
}

function showQuestion() {
  if (pracIdx >= pracQuestions.length) { showSummary(); return; }
  const q = pracQuestions[pracIdx];
  let opts = q.options;
  if (typeof opts === 'string') { try { opts = JSON.parse(opts); } catch (e) { opts = []; } }
  if (!Array.isArray(opts)) opts = [];

  let ansIdx = -1;
  const qtype = q.type || q.question_type || 'choice';
  const ans = q.answer != null ? String(q.answer) : '';
  if (qtype === 'judge') {
    const clean = ans.replace(/[，,。\.\s]/g, '');
    if (clean === '正确' || clean.startsWith('正确')) ansIdx = 0;
    else if (clean === '错误' || clean.startsWith('错误')) ansIdx = 1;
    else ansIdx = (clean === 'true' || clean === '1') ? 0 : 1;
  } else {
    const idx = opts.findIndex(o => {
      const oClean = String(o).replace(/[，,。\.\s：:]/g, '').trim();
      const aClean = ans.replace(/[，,。\.\s：:]/g, '').trim();
      return oClean === aClean || o.startsWith(ans) || ans.startsWith(o.substring(0, Math.max(3, ans.length)));
    });
    ansIdx = idx >= 0 ? idx : (parseInt(ans) >= 0 && parseInt(ans) < opts.length ? parseInt(ans) : -1);
  }
  q._answer_idx = ansIdx;

  const typeLabel = { choice: '选择题', judge: '判断题', fill: '填空题', analysis: '分析题', code: '编程题' };
  let h = `<div class="pbar"><span class="pb-t">第 ${pracIdx + 1}/${pracQuestions.length} 题</span><div class="pb-r"><div class="pb-f" style="width:${(pracIdx/pracQuestions.length*100)}%"></div></div></div>`;
  h += `<div class="qcard"><div class="qinfo">${typeLabel[qtype] || qtype} · ${q.level || 'L1'} · ${q.difficulty || '中等'}</div>`;
  h += `<div class="qdesc">${q.description || q.question || ''}</div>`;
  if (q.starter_code) h += `<div class="qcode">${q.starter_code}</div>`;

  if (qtype === 'choice' || qtype === 'judge') {
    const displayOpts = qtype === 'judge' ? ['正确', '错误'] : opts;
    h += displayOpts.map((o, i) => {
      const cls = q._answered ? (i === ansIdx ? ' correct' : (i === q._selectedIdx && i !== ansIdx ? ' wrong' : '')) : (i === q._selectedIdx ? ' sel' : '');
      const disabled = q._answered ? 'disabled' : '';
      return `<button class="opt${cls}" onclick="selectOption(${pracIdx},${i})" ${disabled}>${String.fromCharCode(65+i)}. ${o}</button>`;
    }).join('');
  } else if (qtype === 'fill') {
    h += q._answered
      ? `<div class="inp" style="background:var(--card)">${q._userAnswer || ''}</div>`
      : `<textarea class="inp" id="fillAnswer" placeholder="输入你的答案..."></textarea>`;
  } else if (qtype === 'analysis' || qtype === 'code') {
    h += q._answered
      ? `<div class="co" style="background:var(--card)">${q._userAnswer || ''}</div>`
      : `<textarea class="inp" id="fillAnswer" placeholder="输入你的答案/代码..."></textarea>`;
  }

  if (q._answered) {
    h += `<div class="fb ${q._isCorrect ? 'fb-ok' : 'fb-err'}">`;
    h += q._isCorrect ? '✅ 回答正确！' : '❌ 回答错误';
    h += `<br>正确答案：${ans}`;
    if (q.explanation) h += `<br><br>📖 ${q.explanation}`;
    h += `</div>`;
  }

  h += `</div>`;
  h += '<div class="act-row">';
  if (!q._answered) {
    if (qtype === 'fill' || qtype === 'analysis' || qtype === 'code') {
      h += `<button class="btn btn-ac" onclick="submitTextAnswer(${pracIdx})">提交答案</button>`;
    }
    h += `<button class="btn btn-bd" onclick="skipQuestion()">跳过</button>`;
  } else {
    h += `<button class="btn btn-ac" onclick="nextQuestion()">${pracIdx + 1 >= pracQuestions.length ? '查看总结' : '下一题 →'}</button>`;
  }
  if (pracIdx > 0) h += `<button class="btn btn-bd" onclick="prevQuestion()">← 上一题</button>`;
  h += `<button class="btn btn-bd" onclick="backToKpGrid()">换知识点</button>`;
  h += '</div>';

  $('practiceQ').innerHTML = h;
  setStatus('就绪');
}

async function selectOption(qIdx, optIdx) {
  const q = pracQuestions[qIdx];
  q._selectedIdx = optIdx;
  q._userAnswer = (q.type === 'judge' ? ['正确', '错误'] : q.options || [])[optIdx] || String(optIdx);
  q._answered = true;
  q._isCorrect = (optIdx === q._answer_idx);

  try {
    await api(`/api/questions/${userId}/submit`, {
      method: 'POST',
      body: JSON.stringify({
        question_id: q.id, knowledge_point: pracKp,
        answer: q._userAnswer, is_correct: q._isCorrect,
        question_type: q.type || 'choice', current_level: parseInt(q.level?.replace('L','')) || 1
      })
    });
    pracResults.push({ isCorrect: q._isCorrect });
    refreshProfile();
  } catch (e) {}

  showQuestion();
}

async function submitTextAnswer(qIdx) {
  const q = pracQuestions[qIdx];
  const val = ($('fillAnswer')?.value || '').trim();
  if (!val) return;
  q._userAnswer = val;
  q._answered = true;
  const ans = String(q.answer || '');
  q._isCorrect = val.includes(ans) || ans.includes(val.substring(0, Math.max(3, ans.length)));

  try {
    await api(`/api/questions/${userId}/submit`, {
      method: 'POST',
      body: JSON.stringify({
        question_id: q.id, knowledge_point: pracKp,
        answer: val, is_correct: q._isCorrect,
        question_type: q.type || 'fill', current_level: parseInt(q.level?.replace('L','')) || 1
      })
    });
    pracResults.push({ isCorrect: q._isCorrect });
    refreshProfile();
  } catch (e) {}

  showQuestion();
}

function skipQuestion() {
  pracResults.push({ isCorrect: false, skipped: true });
  pracIdx++;
  showQuestion();
}

function nextQuestion() {
  pracIdx++;
  showQuestion();
}

function prevQuestion() {
  if (pracIdx > 0) { pracIdx--; showQuestion(); }
}

function showSummary() {
  const total = pracResults.length;
  const correct = pracResults.filter(r => r.isCorrect).length;
  const wrong = pracResults.filter(r => !r.isCorrect && !r.skipped).length;
  const skipped = pracResults.filter(r => r.skipped).length;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;

  $('practiceQ').style.display = 'none';
  $('practiceSummary').style.display = 'block';
  $('practiceSummary').innerHTML = `
    <div class="summary">
      <div class="big" style="color:${rate >= 60 ? 'var(--g)' : 'var(--r)'}">${rate}%</div>
      <div class="sub">正确率</div>
      <div class="stats">
        <div class="stat"><div class="n" style="color:var(--g)">${correct}</div><div class="lb">正确</div></div>
        <div class="stat"><div class="n" style="color:var(--r)">${wrong}</div><div class="lb">错误</div></div>
        <div class="stat"><div class="n" style="color:var(--y)">${skipped}</div><div class="lb">跳过</div></div>
      </div>
      <div class="act-row" style="justify-content:center">
        <button class="btn btn-ac" onclick="startPractice('${pracKp}')">再练一次</button>
        <button class="btn btn-bd" onclick="backToKpGrid()">换知识点</button>
      </div>
    </div>
  `;
  setStatus('练习完成');
}

let codeTemplates = [];
let currentTplId = '';

async function loadCodeTab() {
  if ($('codeKp').children.length > 1) return;
  try {
    const data = await api('/api/code/templates');
    codeTemplates = data.templates || [];
    const kps = [...new Set(codeTemplates.map(t => t.knowledge_point).filter(Boolean))];
    $('codeKp').innerHTML = '<option value="">选择知识点</option>' +
      kps.map(k => `<option value="${k}">${k}</option>`).join('');
    setStatus('就绪');
  } catch (e) {
    setStatus('代码模板加载失败: ' + e.message);
  }
}

function onCodeKpChange() {
  const kp = $('codeKp').value;
  if (!kp) { $('codeTpl').innerHTML = '<option value="">选择模板</option>'; return; }
  const tpls = codeTemplates.filter(t => t.knowledge_point === kp);
  $('codeTpl').innerHTML = '<option value="">选择模板</option>' +
    tpls.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
}

async function onCodeTplChange() {
  const id = $('codeTpl').value;
  if (!id) return;
  currentTplId = id;
  try {
    const tpl = await api(`/api/code/templates/${id}`);
    $('codeEditor').value = tpl.code || tpl.starter_code || '';
  } catch (e) {
    $('codeEditor').value = '// 模板加载失败: ' + e.message;
  }
  $('codeOutput').style.display = 'none';
  $('codeAnalysis').style.display = 'none';
}

async function runCode() {
  const code = $('codeEditor').value.trim();
  if (!code) return;
  $('btnRun').disabled = true;
  $('btnRun').textContent = '运行中...';
  setStatus('代码执行中...');
  try {
    const r = await api('/api/code/execute', {
      method: 'POST',
      body: JSON.stringify({ code, knowledge_point: $('codeKp').value || 'unknown', template_id: currentTplId })
    });
    $('codeOutput').style.display = 'block';
    if (r.error) {
      $('codeOutput').innerHTML = `<span style="color:var(--r)">错误：</span>${r.error}\n${r.stderr || ''}`;
    } else {
      $('codeOutput').innerHTML = (r.output || r.stdout || '执行成功（无输出）');
    }
    setStatus('执行完成');
  } catch (e) {
    $('codeOutput').style.display = 'block';
    $('codeOutput').innerHTML = `<span style="color:var(--r)">请求失败：</span>${e.message}`;
    setStatus('执行失败');
  }
  $('btnRun').disabled = false;
  $('btnRun').textContent = '▶ 运行';
}

async function analyzeCode() {
  const code = $('codeEditor').value.trim();
  if (!code) return;
  setStatus('AI分析中...');
  $('codeAnalysis').style.display = 'block';
  $('codeAnalysisBody').innerHTML = '<div class="loading">分析中...</div>';
  try {
    const r = await api('/api/code/analyze', {
      method: 'POST',
      body: JSON.stringify({ code, knowledge_point: $('codeKp').value || 'unknown' })
    });
    const a = r.analysis || r;
    $('codeAnalysisBody').innerHTML = `
      ${a.summary ? `<p><b>概述：</b>${a.summary}</p>` : ''}
      ${a.time_complexity ? `<p><b>时间复杂度：</b>${a.time_complexity}</p>` : ''}
      ${a.space_complexity ? `<p><b>空间复杂度：</b>${a.space_complexity}</p>` : ''}
      ${a.optimization ? `<p><b>优化建议：</b>${a.optimization}</p>` : ''}
      ${a.line_comments ? `<p><b>逐行注释：</b><br>${a.line_comments.replace(/\n/g,'<br>')}</p>` : ''}
      ${typeof a === 'string' ? a.replace(/\n/g,'<br>') : ''}
    `;
    setStatus('分析完成');
  } catch (e) {
    $('codeAnalysisBody').innerHTML = `<span style="color:var(--r)">分析失败：${e.message}</span>`;
    setStatus('分析失败');
  }
}

// ===== PATH TAB =====
let pathData = null;

async function loadPathTab() {
  setStatus('加载学习路径...');
  try {
    const r = await api(`/api/path/${userId}`);
    pathData = r;
    renderPathTab();
  } catch (e) {
    $('pathContent').innerHTML = `<div class="empty"><div class="icon">🗺️</div><p>请先建立学习画像</p><button class="btn btn-ac" onclick="openColdStart()">建立画像</button></div>`;
    setStatus('就绪');
  }
}

function renderPathTab() {
  if (!pathData || !pathData.path) {
    $('pathContent').innerHTML = '<div class="empty"><p>暂无路径数据</p></div>';
    return;
  }
  const p = pathData.path;
  const strategyLabels = { steady: '稳扎稳打', focused: '重点突破', practice: '实践驱动' };
  const statusLabels = { mastered: '已掌握', learning: '学习中', todo: '待学习', weak: '薄弱', review: '需复习' };
  const statusCls = { mastered: 'pn-mastered', learning: 'pn-learning', todo: 'pn-todo', weak: 'pn-weak', review: 'pn-review' };

  let h = `<div class="path-card">
    <h4>学习路径 - ${strategyLabels[p.strategy] || p.strategy}</h4>
    <div class="sr"><span class="l">总知识点</span><span class="v">${p.total_nodes}</span></div>
    <div class="sr"><span class="l">已掌握</span><span class="v" style="color:var(--g)">${p.mastered_count}</span></div>
    <div class="sr"><span class="l">薄弱点</span><span class="v" style="color:var(--r)">${p.weak_count}</span></div>
    <div class="sr"><span class="l">完成率</span><span class="v">${Math.round(p.completion_rate * 100)}%</span></div>
    <div class="sr"><span class="l">预估剩余</span><span class="v">${p.estimated_total_hours}小时</span></div>
    <div class="pbar" style="margin-top:8px"><div class="pb-r"><div class="pb-f" style="width:${Math.round(p.completion_rate*100)}%;background:var(--g)"></div></div></div>
  </div>`;

  // Path nodes
  h += '<div class="path-card"><h4>知识路径</h4>';
  const displayNodes = (p.nodes || []).slice(0, 20);
  displayNodes.forEach(n => {
    const cls = statusCls[n.status] || 'pn-todo';
    const label = statusLabels[n.status] || n.status;
    h += `<div class="path-node">
      <div class="pn-ord ${cls}">${n.order + 1}</div>
      <div class="pn-name">${n.name} <span class="tag tag-${n.status === 'weak' ? 'weak' : n.status === 'mastered' ? 'solid' : 'new'}" style="font-size:9px">${label}</span></div>
      <div class="pn-hours">${n.estimated_hours}h</div>
    </div>`;
  });
  if ((p.nodes || []).length > 20) h += `<div style="text-align:center;color:var(--t2);font-size:12px;padding:8px">...还有${p.nodes.length - 20}个知识点</div>`;
  h += '</div>';

  // Simulation
  h += '<div class="path-card"><h4>路径模拟</h4><div class="path-sim">';
  const periods = ['2周', '1月', '2月'];
  const sims = pathData.simulations || [];
  periods.forEach((period, i) => {
    const sim = sims[i] || {};
    h += `<div class="sim-card">
      <div class="sim-period">${period}</div>
      <div class="sim-val">${Math.round((sim.expected_mastery_gain || 0) * 100)}%</div>
      <div class="sim-label">掌握度提升</div>
      <div style="font-size:11px;color:var(--t2);margin-top:4px">${sim.expected_questions || 0}题 · ${sim.expected_code_exercises || 0}代码</div>
      ${(sim.risk_points || []).length > 0 ? `<div style="font-size:10px;color:var(--y);margin-top:4px">${sim.risk_points[0]}</div>` : ''}
    </div>`;
  });
  h += '</div></div>';

  // Multi-path comparison
  if (pathData.paths) {
    h += '<div class="path-card"><h4>多路径对比</h4>';
    for (const [key, pp] of Object.entries(pathData.paths)) {
      h += `<div class="sr"><span class="l">${strategyLabels[key] || key}</span><span class="v">${Math.round(pp.completion_rate * 100)}% · ${pp.estimated_total_hours}h</span></div>`;
    }
    h += '</div>';
  }

  // Action buttons
  h += '<div class="act-row">';
  h += '<button class="btn btn-ac" onclick="loadPathTab()">刷新路径</button>';
  h += '<button class="btn btn-bd" onclick="loadNextStep()">推荐下一步</button>';
  h += '<button class="btn btn-bd" onclick="loadReviewSchedule()">复习调度</button>';
  h += '</div>';

  $('pathContent').innerHTML = h;
  setStatus('就绪');
}

async function loadNextStep() {
  setStatus('推荐下一步...');
  try {
    const r = await api(`/api/path/${userId}/next`);
    if (r.next) {
      const n = r.next;
      alert(`推荐学习：${n.name}\n状态：${n.status}\n预估时长：${n.estimated_hours}小时\n推荐方式：${n.recommended_method || '文档学习'}`);
    } else {
      alert('所有知识点已掌握！');
    }
  } catch (e) {
    alert('获取推荐失败: ' + e.message);
  }
  setStatus('就绪');
}

async function loadReviewSchedule() {
  setStatus('加载复习调度...');
  try {
    const r = await api(`/api/social/review-schedule/${userId}`);
    const schedule = r.schedule || [];
    if (schedule.length === 0) {
      alert('暂无需要复习的知识点');
      return;
    }
    let msg = '复习调度：\n\n';
    schedule.slice(0, 10).forEach(s => {
      const urgency = s.urgency === 'urgent' ? '🔴紧急' : s.urgency === 'soon' ? '🟡即将到期' : '🟢正常';
      msg += `${urgency} ${s.name} - ${s.days_overdue > 0 ? `逾期${s.days_overdue}天` : '按计划'}\n`;
    });
    alert(msg);
  } catch (e) {
    alert('获取复习调度失败: ' + e.message);
  }
  setStatus('就绪');
}

// ===== DASHBOARD TAB =====
let dashData = null;

async function loadDashboard() {
  setStatus('加载仪表盘...');
  try {
    const r = await api(`/api/social/dashboard/${userId}`);
    dashData = r.dashboard;
    renderDashboard();
  } catch (e) {
    $('dashContent').innerHTML = `<div class="empty"><div class="icon">📊</div><p>请先建立学习画像</p><button class="btn btn-ac" onclick="openColdStart()">建立画像</button></div>`;
    setStatus('就绪');
  }
}

function renderDashboard() {
  if (!dashData) { $('dashContent').innerHTML = '<div class="empty"><p>暂无数据</p></div>'; return; }

  let h = '<div class="section-title">学习概览</div>';
  h += '<div class="dash-grid">';
  h += `<div class="dash-card"><div class="dc-val" style="color:var(--a2)">${Math.round((dashData.overall_completion || 0) * 100)}%</div><div class="dc-label">总完成率</div></div>`;
  h += `<div class="dash-card"><div class="dc-val" style="color:var(--g)">${dashData.mastered_count || 0}</div><div class="dc-label">已掌握知识点</div></div>`;
  h += `<div class="dash-card"><div class="dc-val" style="color:var(--r)">${dashData.weak_points_count || 0}</div><div class="dc-label">薄弱环节</div></div>`;
  h += `<div class="dash-card"><div class="dc-val">${dashData.total_study_hours?.toFixed(1) || 0}</div><div class="dc-label">学习时长(小时)</div></div>`;
  h += `<div class="dash-card"><div class="dc-val">${dashData.questions_answered || 0}</div><div class="dc-label">答题数</div></div>`;
  h += `<div class="dash-card"><div class="dc-val">${dashData.code_submissions || 0}</div><div class="dc-label">代码提交</div></div>`;
  h += '</div>';

  // Radar chart (simple text version)
  if (dashData.radar) {
    h += '<div class="section-title">知识掌握雷达</div>';
    h += '<div class="path-card"><div style="display:flex;flex-wrap:wrap;gap:8px">';
    dashData.radar.categories.forEach((cat, i) => {
      const val = dashData.radar.values[i] || 0;
      const pct = Math.round(val * 100);
      const cls = val >= 0.7 ? 'bar-h' : val >= 0.3 ? 'bar-m' : 'bar-l';
      h += `<div style="flex:1;min-width:120px"><div class="sr"><span class="l">${cat}</span><span class="v">${pct}%</span></div><div class="bar-wrap"><div class="bar-f ${cls}" style="width:${pct}%"></div></div></div>`;
    });
    h += '</div></div>';
  }

  // Achievements
  if (dashData.achievements && dashData.achievements.length > 0) {
    h += '<div class="section-title">成就系统</div>';
    h += '<div class="ach-grid">';
    dashData.achievements.forEach(a => {
      h += `<div class="ach-item ${a.unlocked ? 'unlocked' : ''}">
        <div class="ach-icon">${a.icon || '🏆'}</div>
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.description}</div>
        <div class="ach-bar"><div class="ach-bar-f" style="width:${Math.round(a.progress * 100)}%"></div></div>
      </div>`;
    });
    h += '</div>';
  }

  // Recent activities
  if (dashData.recent_activities && dashData.recent_activities.length > 0) {
    h += '<div class="section-title">近期活动</div>';
    h += '<div class="path-card">';
    dashData.recent_activities.slice(0, 10).forEach(a => {
      h += `<div class="path-node"><div class="pn-ord pn-learning" style="font-size:9px">${a.type === 'code' ? '💻' : a.type === 'share' ? '🤝' : '📝'}</div><div class="pn-name">${a.description}</div><div class="pn-hours">${(a.timestamp || '').substring(5, 16)}</div></div>`;
    });
    h += '</div>';
  }

  // Refresh button
  h += '<div class="act-row" style="margin-top:16px"><button class="btn btn-ac" onclick="loadDashboard()">刷新</button></div>';

  $('dashContent').innerHTML = h;
  setStatus('就绪');
}

// ===== INIT =====
async function init() {
  try {
    profile = await api(`/api/profile/${userId}`);
    renderSidebar();
  } catch (e) {
    openColdStart();
  }
}

init();
</script>
</body>
</html>
